<table mat-table [dataSource]="dataSource()" class="mat-elevation-z8 demo-table">
	<!-- title Column -->
	<ng-container matColumnDef="title">
		<th mat-header-cell *matHeaderCellDef>Título</th>
		<td mat-cell *matCellDef="let element">{{element.title}}</td>
	</ng-container>

	<!-- author_name Column -->
	<ng-container matColumnDef="author_name">
		<th mat-header-cell *matHeaderCellDef>Autor</th>
		<td mat-cell *matCellDef="let element">{{element.author_name}}</td>
	</ng-container>

	<!-- first_publish_year Column -->
	<ng-container matColumnDef="first_publish_year">
		<th mat-header-cell *matHeaderCellDef>Ano de publicação</th>
		<td mat-cell *matCellDef="let element">{{element.first_publish_year}}</td>
	</ng-container>

	<!-- language Column -->
	<ng-container matColumnDef="language">
		<th mat-header-cell *matHeaderCellDef>Idioma disponível</th>
		<td mat-cell *matCellDef="let element">{{element.language}}</td>
	</ng-container>

	<tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
	<tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
